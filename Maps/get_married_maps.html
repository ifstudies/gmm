            // using the following functions:
            // create_rgb_int_array() and create_stepped_colormap(). (These are both available within
            // charting_code.py.)

            let color_list =

                ['rgb(28, 22, 120)',
                    'rgb(67, 63, 133)',
                    'rgb(107, 104, 146)',
                    'rgb(146, 145, 159)',
                    'rgb(179, 168, 160)',
                    'rgb(204, 173, 148)',
                    'rgb(230, 178, 136)',
                    'rgb(255, 183, 124)'];

            color_count = color_list.length

           function wrap_strings(raw_string, max_line_length) {
                // This function creates a wrapped copy of a string for inclusion within
                // Plotly charts and other features.

                // (The use of .split() and .join() here is based on:
                // https://github.com/75lb/wordwrapjs/blob/master/index.js

                //("raw_string", raw_string);

                // This code may fail to work if any word is longer 
                // than max_line_length.
                let string_words = raw_string.split(" ");
                if (string_words.length == 1)
                // In this case, we'll simply return the current word rather
                // than attempt to iterate through a list of words.
                {
                    return raw_string
                }
                let wrapped_string_lines = [];
                // Initializing current_line_string as the first item within
                // string_words allows us to specify that a space *not* be 
                // added before this word (the default behavior in the following
                // loop).
                let current_line_string = string_words[0];

                for (let i = 1; i < string_words.length; i++) {
                    if ((current_line_string + " " + string_words[i]).length <= max_line_length) {
                        current_line_string += " " + string_words[i]
                    }
                    else {
                        wrapped_string_lines.push(current_line_string)
                        current_line_string = string_words[i]
                        // Initializing the next line with this word
                        // so that it won't get skipped over
                    }
                    if (i == string_words.length - 1)
                    // Making sure to send the final line over as well
                    { wrapped_string_lines.push(current_line_string) }
                }

                //console.log("wrapped_string_lines", wrapped_string_lines)
                wrapped_string = wrapped_string_lines.join("<br>");

                return wrapped_string
            }

            // Creating a map that will allow for more readable titles:
            const title_map = new Map([["married_in_past_year", "% married in past year"],
        ["income_at_least_60k", "% with a personal income at/above $60,000"],
        ["married", "% married"],
        ["aa_or_higher", "% with an AA or higher"],
        ["ba_or_higher", "% with a BA or higher"],
        ["employed_full_time", "% employed full time"]
        ]);


            // Initializing the map
            updateMap()

 

            function updateMap() {

                selected_metric = metricOptionElement.value;
                selected_color = colorOptionElement.value;
                selected_sex_option = sexOptionElement.value;
                selected_age_option = ageOptionElement.value;

                console.log("Selected metric and color", selected_metric, selected_color);

                // Including only those rows whose age ranges are present in a list of age categories:
                // (Based on: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/includes)

                // let test_pivot_data = test_pivot_data_unfiltered.filter(
                // function (d) {return (age_cat_array.includes(d.age_cat)) 
                // & (d.male_female == "Male")});

                console.log("Length of df_data_unfiltered:", df_data_unfiltered.shape[0])

                console.log("df_data_unfiltered:", df_data_unfiltered)

                // Making sure we don't permanently modify the source DataFrame (which could cause
                // issues when running subsequent updates):
                let df = df_data_unfiltered.copy()


                // Filtering by age_category:
                // Note: to allow multiple categories to be included, you could first determine
                // which ones should *not* be included, then filter out the DataFrame one by one.
                // Alternatively, you could use array.includes() (See
                // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/includes ),
                // but this would require that you import your data in a less-efficient manner.
                // (See v12 of this document for an example of this approach.)

                if (selected_age_option != "All") // There won't be any need to filter the DataFrame
                // if all age groups are being requested.

                {df = df.query(df["age_cat"].eq(selected_age_option)).copy()
                // The index needs to be reset at this point in order to allow subsequent query
                // operations to work correctly. See: https://github.com/javascriptdata/danfojs/issues/471
                df.resetIndex({inplace: true})
                }

                console.log("Length of df after applying age filter (if any):", df.shape[0])


                console.log("Length of df:", df.shape[0])

                // Filtering by sex:
                if (selected_sex_option != 'Both')
                {df = df.query(df["male_female"].eq(selected_sex_option)).copy()
                df.resetIndex({inplace: true})}

                console.log("Length of df:", df.shape[0])
                console.log("df following application of sex filter (if any)", df)


                // Calculating weighted percentages:
                // This code divides, for the selected metric, the sum of all metric + '_1_weight' values
                // by the sum of all metric + '_total_weight' values. (This approach works well for
                // calculating weighted sums, but does require some preprocessing within Python.)
                // It won't work as well for non-boolean fields; those will require an alternative 
                // approach.

                // The following code is based on
                // https://danfo.jsdata.org/getting-started#selection-by-label ,
                // https://danfo.jsdata.org/api-reference/dataframe/danfo.dataframe.groupby ,
                // and 
                // https://danfo.jsdata.org/api-reference/dataframe/danfo.dataframe.sum

                // Note that you need to use the .col() method prior to calculating your sums; otherwise,
                // although the code will run, the output will be very hard to work with. This approach
                // keeps the pivot table in DataFrame format, which allows for much easier calculations.

                // Finding sums by STATEFP_MSA (which will be unique to each MSA or state-level ex-MSA
                // region):
                let df_pivot = df.loc({
                    columns: ['STATEFP_MSA', selected_metric+'_1_weight',
                        selected_metric+'_total_weight']
                }).groupby(["STATEFP_MSA"]).col([selected_metric+'_1_weight',
                    selected_metric+'_total_weight']).sum();
                // Danfo.js automatically added '_sum' suffixes to the two fields
                // we passed to .sum(), so we'll need to incorporate those suffixes
                // into the following code.
                
                df_pivot.addColumn(selected_metric+'_pct',
                    df_pivot[selected_metric+'_1_weight_sum'].div(
                        df_pivot[selected_metric+'_total_weight_sum']).apply(
                    (x) => { return x * 100 }), { inplace: true })


                console.log("df_pivot with new column added:", df_pivot)


                metric_values = df_pivot[selected_metric+'_pct'].values;

                // Calculating minimum and maximum values for interpolation work:
                let min_val = d3.min(metric_values)
                let max_val = d3.max(metric_values)
                let min_max_range = max_val - min_val

                let threshold_array = [] // This array will store linear 
                // data thresholds for labeling purposes.

                let colorscale = [];
                let data_bins = [];

                let min_bin_val_array = [];
                let max_bin_val_array = [];

                let interpolated_min_bin_val_array = [];
                let interpolated_max_bin_val_array = [];

                let bin_threshold_array = [];

                let z_val = metric_values; // This will be changed to quantile_bins
                // for the quantile-color condition.

                if ((selected_color == 'quantiles') | (
                    selected_color == 'original_values_stepped')) {

                    // In this case, we'll create a set of stepped colors, then assign
                    // various metric values to one of those specific colors.

                    // Determining all of the values that fall within each bin:
                    // (Although we won't need all of these values, knowing the length
                    // of each bin will help ensure that the resulting bins are
                    // relatively equal in length. In addition, we can use this data
                    // to retrieve the smallest and largest values within each bin, which
                    // will prove very useful for mapping purposes.)


                    // Creating either linear or quantile-based thresholds for our stepped
                    // color list:
                    if (selected_color == 'original_values_stepped') {

                        for (let i = 1; i < color_count; i++) {
                            bin_threshold_array.push(
                                min_val + (i) / (color_count) * min_max_range);

                        }
                    }
                    // The number of bins created by this code will be one greater
                    // than the integer passed to thresholds.
                    else if (selected_color == 'quantiles') {
                        for (let i = 1; i < color_count; i++) {
                            // Using d3.quantile() allows us to create quantile-based bins.
                            // See https://d3js.org/d3-array/summarize#quantile
                            bin_threshold_array.push(d3.quantile(metric_values, i / color_count))
                        }
                        // You don't need to add a bin for the maximum or minimum values.
                        // See https://d3js.org/d3-array/bin#bin_thresholds
                        // for reference.

                    }

                    console.log("bin_threshold_array", bin_threshold_array)

                    data_bins = d3.bin().thresholds(bin_threshold_array)(metric_values);
                    console.log("data_bins",data_bins)


                    // Storing minimum and maximum values within each bin:
                    // Note: data_bins_array also includes x0 and x1 values;
                    // however, the x1 values are exclusive (save for the last bin),
                    // so we won't be able to use them to determine the actual highest value
                    // for most bins. (It also appears that the x0 values don't necessarily
                    // exist in each array either.)
                    for (let i = 0; i < data_bins.length; i++) {
                        min_bin_val_array.push(d3.min(data_bins[i]));
                        max_bin_val_array.push(d3.max(data_bins[i]));
                    }


                    // Creating interpolated versions of these for use 
                    // within colorscales (which require a 0-1 scale):

                    for (let i = 0; i < data_bins.length; i++) {
                        interpolated_min_bin_val_array.push((min_bin_val_array[i] - min_val) / min_max_range);
                        interpolated_max_bin_val_array.push((max_bin_val_array[i] - min_val) / min_max_range);
                    }


                    console.log("Data bins:", data_bins);
                    console.log("min_bin_val_array:", min_bin_val_array);
                    console.log("max_bin_val_array:", max_bin_val_array);
                    console.log("interpolated_min_bin_val_array:", interpolated_min_bin_val_array);
                    console.log("interpolated_max_bin_val_array:", interpolated_max_bin_val_array);

                    // Testing out a colorscale based on min and max values within each D3 bin rather than
                    // our manually-calculated vaules:
                    // (Make sure that this approach doesn't cause any items to get left out.)

                    // NOTE: When selected_color is set to original_values_stepped,
                    // it's possible that certain linear bins will have 0 values. (We can check
                    // for this condition by looking up the length of each data bin.)
                    // Therefore, we should skip over those values when (1) creating our color scale
                    // and (2) creating our CSS-based legend. 
                    // I could have simply excluded these items from data_bins, but allowing them in
                    // allows our color and bin indices to remain in sync, thus ensuring that all
                    // ranges of our color palette are still visible. We could also update the 
                    // color palette on the fly, but that would add unnecessary complexity
                    // to this code.

                    colorscale = [];
                    for (let i = 0; i < data_bins.length; i++) {
                        console.log("Length of data bin", i, "is: ", data_bins[i].length)
                        if (data_bins[i].length > 0)
                        {colorscale.push([interpolated_min_bin_val_array[i], color_list[i]],
                            [interpolated_max_bin_val_array[i], color_list[i]])
                        }
                    }


                    console.log("colorscale:", colorscale)

                    // I found that Plotly will interpolate our metric values to our 
                    // 0-1 colorscale on its own; therefore, we won't need to 
                    // create interpolated values ourselves (though this is pretty 
                    // easy to do; see commented-out code below)

                    z_val = metric_values;

                    //     let interpolated_metric_values = [];
                    //     for (let i = 0; i < metric_values.length; i++)
                    //     {interpolated_metric_values.push(
                    // (metric_values[i] - min_val)/min_max_range)}
                    //     z_val = interpolated_metric_values;

                }


                else if (selected_color == 'original_values') {

                    // Calculating equally-spaced values for our linear-based legend:
                    // (The quantile-based legend will show two items within each value,
                    // whereeas the linear-based one will just show a single item per value.
                    // Therefore, we can include one fewer item within the linear array.)
                    // (An alternative approach would be to create a stepped array for the 
                    // linear one--but this approach should work fine for now.)

                    for (let i = 0; i < color_count; i++)

                        threshold_array.push(
                            min_val + (i / (color_count - 1)) * (min_max_range));


                    // While our quantile-based legend uses a discrete/stepped colorscale,
                    // our linear legend will instead use a continuous colorscale with
                    // a distinct midpoint color.
                    colorscale = [[0, 'rgb(28, 22, 120)'],
                    [0.5, 'rgb(166, 166, 166)'],
                    [1, 'rgb(255, 183, 124)']];


                    z_val = metric_values;

                }

                // Note: the number of colors you'll need for your colorscale will be one less
                // than the number of items in the array above. Thus, for an
                // 8-value quantile array, you'll need 7 distinct colors.
                // This also means that, if you want a specific midpoint, you should use an even number of values.

                console.log("min_val:", min_val)
                console.log("max_val:", max_val)
                console.log("min_max_range:", min_max_range)

                console.log("Threshold array:", threshold_array)

                console.log("colorscale:", colorscale)

                metric_for_title = title_map.get(selected_metric);

                // Wrapping the metric's name so that it won't take up too much horizontal space
                // within our tooltips:
                let wrapped_metric = wrap_strings(metric_for_title.replace(
                    'Percent', '%'), 28);


                let data = [{
                    //customdata: metric_values, // For inclusion in our hover template
                    type: "choroplethmap", locations: df_pivot["STATEFP_MSA"].values,
                    z: z_val,
                    geojson: msa_geojson,
                    hovertemplate: "Region: <b>%{properties.region_name}</b><br>" + wrapped_metric +
                        ": <b>%{z:.1f}</b>" + "<extra></extra>",
                    // Based on https://plotly.com/javascript/reference/choroplethmap/#choroplethmap-zmin
                    // and StackOverflow user christian's response at
                    // https://stackoverflow.com/a/75752633/13097194
                    // To add your customdata values to your hovertemplate, you 
                    // can use something like the following:
                    // ": %{customdata:.1f}"
                    featureidkey: "properties.STATEFP_MSA",

                    // A white outline makes it easier to distinguish different
                    // blue-colored regions. See:
                    // https://plotly.com/javascript/reference/choropleth/#choropleth-marker-line
                    marker: {line: {width: 0.3,
                    color: '#FFFFFF'
                    },
                },

                    showscale: false,
                    // Change showscale to true and uncomment the following lines 
                    // to preview what Plotly's own colorbar would look like:
                    // colorbar: {orientation: "h",
                    //     len: 0.5
                    // },

                    // The above line links the MSA field in the dataset to the MSA
                    // field in the GeoJSON file, thus instructing Plotly to use it as
                    // the reference region for our map.

                    // Note: see older versions of this script for code that configures
                    // a Plotly-based colorbar. (I'm using a custom CSS-based colorbar because
                    // it allows for more flexibility, but a Plotly-based bar could definitely
                    // work as well.)

                    colorscale: colorscale, // Regardless of whether or not Plotly's colorbar is 
                    // shown, this argument is crucial for correctly coloring our regions.

                    // For reference, see: https://plotly.com/javascript/reference/choroplethmap/
                },


                ];

                let layout = {
                    map: {
                        center: { lon: -95, lat: 37 }, zoom: 3.1,
                        style: "https://tiles.openfreemap.org/styles/bright",
                        // The following code (based on https://plotly.com/javascript/choropleth-maps/)
                        // adds state outlines to our choropleth map.
                        // The MSA-level layers don't need to be added here, as they were already
                        // specified above.
                        // alternative: 'white-bg' (but an option to make it peach-colored would be better)
                        // layers: [{
                        // sourcetype: 'geojson',
                        // source: state_outlines,
                        // type: 'fill',
                        // color: 'rgba(0, 0, 0, 0)'}]
                    },

                    // Making the plot and background colors transparent so as to reveal our regular
                    // background color:

                    plot_bgcolor: '#00000000',
                    paper_bgcolor: '#00000000',
                    // Based on https://plotly.com/javascript/bar-charts/

                    // Height and width options will be set by the div and container to which
                    // this map belongs.

                    margin: { b: 0, t: 0, l: 0, r: 0 }
                    // See: https://plotly.com/javascript/reference/layout/coloraxis/
                };

                let config = {
                    toImageButtonOptions: { scale: 4 },
                    responsive: true,
                    displayModeBar: false
                }



                // For the style argument (which must be placed within the map section of the layout argument), see:
                // https://plotly.com/javascript/reference/layout/

                // react allows for much more efficient updates than does NewPlot--and prevented the window from
                // flashing when I updated the map. Source:
                // https://plotly.com/javascript/plotlyjs-function-reference/#plotlyreact
                Plotly.react('choropleth_map', data, layout, config);

                // Updating our colorscale element:
                // This is based somewhat on the sample code at 
                // https://leafletjs.com/examples/choropleth/ . (The Leaflet library has been released
                // by Volodymyr Agafonkin under the BSD 2-Clause license.)

                let labels = [];

                if ((selected_color == 'quantiles') | (selected_color == 'original_values_stepped'))
                // Going from the highest to lowest values so that the former appear above
                // the latter in our legend
                // Note: as long as the values are precise enough (i.e. not rounded too much),
                // this approach will show distinct rather than overlapping numbers
                // for each legend, thus making their meanings clearer. In reality, though,
                // rounding will often cause the same number to appear in multiple
                // legends.

                // Multiplying values by 10; rounding them; and then
                // dividing them by 10 lets us round items to the nearest
                // decimal.
                {
                    for (let i = color_count - 1; i >= 0; i--) {
                        if (data_bins[i].length > 0) // As with our colorscale,
                        // we'll want to skip over bins that have 0 entries;
                        // otherwise, we'll end up with NaN values in our legend.
                            {label = Math.round(min_bin_val_array[i] * 10) / 10
                                + "-" + Math.round(max_bin_val_array[i] * 10) / 10
                            // See: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/round
                        labels.push(`<i style="background:${color_list[i]}"></i>&nbsp${label}`);    
                        }

                        
                    }
                }

                else if (selected_color == 'original_values') {
                    for (let i = color_count - 1; i >= 0; i--) {

                        labels.push(`<i style="background:${color_list[i]}"></i>&nbsp${(
                            Math.round(threshold_array[i] * 10) / 10)}`);
                    }
                }

                // Updating the legend:
                colorScaleElement.innerHTML = labels.join('<br>');

                // Updating the title:
                titleElement.innerHTML = "<b>" + metric_for_title.replace('Percent', '%') + "</b>";
            }






        </script>
