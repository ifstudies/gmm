            //     // >= interpolated_array[2] & < interpolated_array[3]
            //     [interpolated_array[2], color_list[2]],
            //     [interpolated_array[3], color_list[2]],

            //     // >= interpolated_array[3] & < interpolated_array[4]
            //     [interpolated_array[3], color_list[3]],
            //     [interpolated_array[4], color_list[3]],

            //     // >= interpolated_array[4] & < interpolated_array[5]
            //     [interpolated_array[4], color_list[4]],
            //     [interpolated_array[5], color_list[4]],

            //     // >= interpolated_array[5] & < interpolated_array[6]
            //     [interpolated_array[5], color_list[5]],
            //     [interpolated_array[6], color_list[5]],

            //     // >= interpolated_array[6]
            //     [interpolated_array[6], color_list[6]],
            //     [interpolated_array[7], color_list[6]]
            // ]

                let colorscale = [
                // Bin encompassing 0/14 quantile-bin values:
                [0, color_list[0]],
                [2/14, color_list[0]],

                // Bin for 3/14 quantile-bin values: 
                [2/14, color_list[1]],
                [4/14, color_list[1]],

                // Bin for 5/14 quantile-bin values:
                [4/14, color_list[2]],
                [6/14, color_list[2]],

                // Bin for 7/14 values:
                [6/14, color_list[3]],
                [8/14, color_list[3]],

                // Bin for 9/14 values:
                [8/14, color_list[4]],
                [10/14, color_list[4]],

                // Bin for 11/14 values:
                [10/14, color_list[5]],
                [12/14, color_list[5]],

                // Bin for 14/14 values:
                [12/14, color_list[6]],
                [1, color_list[6]]
            ]

            // Determining interpolated values for the colorscale:
            // These will be used to determine the location of our 
            // legend data labels.
            // Since we have 7 colors, we'll need 8 values in order to
            // place a value within the edge of each color. Thus,
            // we'll need to interpolate in increments of 1/7 (as 
            // the series 0/7, 1/7 . . . 7/7 contains 8 values.)

            let tickval_array = [];
            for (let i = 0; i < 8; i++) // Will increment from 0 to 7 (inclusive)
        {
            tickval_array.push(i/7);
        }

        console.log("tickval_array:", tickval_array)

            console.log("colorscale:", colorscale)

            let data = [{
                type: "choroplethmap", locations: df["MSA"].values,
                //z: metric_values,
                z: quantile_bins, // We need to use quantile_bins here so that
                // the colorscale uses those values, rather than our metric_values
                // data, for the basis of its value locations.
                geojson: msa_geojson,
                featureidkey: "properties.MSA",
                // The above line links the MSA field in the dataset to the MSA
                // field in the GeoJSON file, thus instructing Plotly to use it as
                // the reference region for our map.

                // Note: the tickvals argument here allows for equally-spaced
                // bars (which can help prevent labels from getting squeezed
                // together when the colorbar is being displayed).
                colorbar: {
                    orientation: "h", len: 0.8, thickness: 20,
                    tickmode: "array", 
                    tickvals: tickval_array,
                    ticktext: rounded_array
                },
                // The tickmode, tickvals, and ticktext values allow us to plot our percentile
                // values on the map (rather than the interpolated values). For reference, see:
                // https://plotly.com/javascript/reference/choroplethmap/#choroplethmap

                // Setting our colorscale:
                // One option would be to use CSS-based scales like those in our Anxious Generation maps--
                // but, for now, I'll try to rework Plotly's colorscale setup to accommodate both
                // linear and percentile-based ones, since that will allow for a simpler codebase overall.
                // (I can always go back to the CSS-based option as needed.)

                colorscale: colorscale,

                // Available under: https://plotly.com/javascript/reference/choroplethmap/
            }];

            let layout = {
                map: {
                    center: { lon: -95, lat: 37 }, zoom: 2.8,
                    style: "https://tiles.openfreemap.org/styles/bright"
                },

                // Making the plot and background colors transparent so as to reveal our regular
                // background color:

                plot_bgcolor: '#00000000',
                paper_bgcolor: '#00000000',
                // Based on https://plotly.com/javascript/bar-charts/

                // Height and width options will be set by the div and container to which
                // this map belongs.

                margin: { b: 0, t: 0, l: 0, r: 0 }
                // See: https://plotly.com/javascript/reference/layout/coloraxis/
            };

            let config = {
                toImageButtonOptions: { scale: 4 },
                responsive: true,
                displayModeBar: false
            }

            // For the style argument (which must be placed within the map section of the layout argument), see:
            // https://plotly.com/javascript/reference/layout/

            // react allows for much more efficient updates than does NewPlot--and prevented the window from
            // flashing when I updated the map. Source:
            // https://plotly.com/javascript/plotlyjs-function-reference/#plotlyreact
            Plotly.react('tester', data, layout, config);

            // Updating our colorscale element:
            // This is based on the sample code at 
            // https://leafletjs.com/examples/choropleth/ . (The Leaflet library has been released
            // by Volodymyr Agafonkin under the BSD 2-Clause license.)

            let labels = [];

            // The following approach specifies the metric ranges that fall within
            // each quantile bin.
            // for (let i = 6; i >=0; i--) {
            //     // Multiplying values by 10; rounding them; and then
            //     // dividing them by 10 lets us round items to the nearest
            //     // decimal.
            //     labels.push(`<i style="background:${color_list[i]}">
            //     </i>${Math.round(quantile_array[i]*10)/10} 
            //     to ${Math.round(quantile_array[i+1]*10)/10}`);
            // }

            // Alternative setup that clarifies what colors values 
            // right on cutoffs will be assigned:
            for (let i = 6; i >= 0; i--) {

                if (i == 6) {
                    label = "[" + rounded_array[i] + ", " + rounded_array[i+1] + "]"
                }

                else {
                    label = "[" + rounded_array[i] + ", " + rounded_array[i+1] + ")"
                }


                labels.push(`<i style="background:${color_list[i]}"></i>&nbsp${label}`);
            }

            colorScaleElement.innerHTML = labels.join('<br>');
        }


    </script>
